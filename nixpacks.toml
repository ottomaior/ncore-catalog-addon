# Railway build. Python is only needed for the optional POST /cron/build webhook
# (scheduled catalog builds run in GitHub Actions). Remove the python lines if you
# don't use the webhook.
[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "python311Packages.virtualenv"]

[phases.install]
cmds = [
    "npm install",
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && node server.js"
