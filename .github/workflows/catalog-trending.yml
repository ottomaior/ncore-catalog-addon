# Felkapott / trending (top 30 by peer score from the last 14 days of uploads) – every 6 hours.
# Also persists data/trending_state.json (peer samples for the momentum ranking). Pushes data → Railway auto-deploys.
name: Catalog – Trending (6h)

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-data
  cancel-in-progress: false

jobs:
  build-trending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run build_trending_catalog.py
        env:
          NCORE_USER: ${{ secrets.NCORE_USER }}
          NCORE_PASS: ${{ secrets.NCORE_PASS }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_PIN: ${{ secrets.TVDB_PIN }}
          NCORE_TRENDING_MOMENTUM: ${{ vars.NCORE_TRENDING_MOMENTUM || '0' }}
        run: python scripts/build_trending_catalog.py

      - name: Check catalog output (fail on empty / shrunken files)
        run: python scripts/check_catalog_output.py data/trending_movies.json data/trending_series.json

      - name: Commit and push data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add data/trending_movies.json data/trending_series.json data/trending_state.json 2>/dev/null || true
          git status
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "chore(data): update trending catalog (top 30, 14-day pool)"
            git push
          fi
