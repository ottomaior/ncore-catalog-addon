# Run RSS→Trakt sync scripts every 3 hours (movies + series).
# Add these repo Secrets: TRAKT_CLIENT_ID, TRAKT_ACCESS_TOKEN, TRAKT_CLIENT_SECRET,
# TRAKT_REFRESH_TOKEN, TRAKT_LIST_SLUG, TRAKT_SERIES_LIST_SLUG, TRAKT_USERNAME.
# Optional: RSS_FEED_MOVIES_1, RSS_FEED_MOVIES_2 (or RSS_FEED_1, RSS_URL).
name: Cron sync RSS to Trakt
on:
  schedule:
    - cron: '0 */3 * * *'   # Every 3 hours at :00 UTC
  workflow_dispatch:         # Manual run from Actions tab
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.TRAKT_CLIENT_ID }}" ] && missing="$missing TRAKT_CLIENT_ID"
          [ -z "${{ secrets.TRAKT_ACCESS_TOKEN }}" ] && missing="$missing TRAKT_ACCESS_TOKEN"
          [ -z "${{ secrets.TRAKT_CLIENT_SECRET }}" ] && missing="$missing TRAKT_CLIENT_SECRET"
          [ -z "${{ secrets.TRAKT_REFRESH_TOKEN }}" ] && missing="$missing TRAKT_REFRESH_TOKEN"
          [ -z "${{ secrets.TRAKT_LIST_SLUG }}" ] && missing="$missing TRAKT_LIST_SLUG"
          [ -z "${{ secrets.TRAKT_SERIES_LIST_SLUG }}" ] && missing="$missing TRAKT_SERIES_LIST_SLUG"
          [ -z "${{ secrets.TRAKT_USERNAME }}" ] && missing="$missing TRAKT_USERNAME"
          if [ -n "$missing" ]; then
            echo "::error::Add these repo Secrets (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi
          echo "All required secrets are set."

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r python-requirements.txt

      - name: Sync movies (RSS → Trakt list)
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TRAKT_LIST_SLUG: ${{ secrets.TRAKT_LIST_SLUG }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          RSS_FEED_MOVIES_1: ${{ secrets.RSS_FEED_MOVIES_1 }}
          RSS_FEED_MOVIES_2: ${{ secrets.RSS_FEED_MOVIES_2 }}
          RSS_FEED_1: ${{ secrets.RSS_FEED_1 }}
          RSS_URL: ${{ secrets.RSS_URL }}
        run: python scripts/sync_rss_to_trakt.py

      - name: Sync series (RSS → Trakt list)
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TRAKT_SERIES_LIST_SLUG: ${{ secrets.TRAKT_SERIES_LIST_SLUG }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
        run: python scripts/sync_series_rss_to_trakt.py
