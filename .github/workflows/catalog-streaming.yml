# Streaming provider catalogs (split from hd_movies/hd_series) – every 6 hours.
# Requires: hd_movies.json, hd_series.json (from Catalog – Latest workflow). Pushes data → Railway auto-deploys.
name: Catalog – Streaming (6h)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-streaming:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run split_catalogs_by_provider.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/split_catalogs_by_provider.py

      - name: Commit and push data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/netflix_movies.json data/netflix_series.json \
                  data/disneyplus_movies.json data/disneyplus_series.json \
                  data/hbomax_movies.json data/hbomax_series.json \
                  data/prime_movies.json data/prime_series.json 2>/dev/null || true
          git status
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "chore(data): update streaming catalogs (Netflix, Disney+, HBO Max, Prime)"
            git push
          fi
