# Netflix, HBO Max, Prime Video – every 6 hours. Pushes data to repo → Railway auto-deploys.
name: Catalog – Streaming (6h)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-streaming:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ncoreparser requests python-dotenv

      - name: Run streaming catalog scripts
        env:
          NCORE_USER: ${{ secrets.NCORE_USER }}
          NCORE_PASS: ${{ secrets.NCORE_PASS }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/build_netflix_catalog.py
          python scripts/build_hbomax_catalog.py
          python scripts/build_primevideo_catalog.py

      - name: Commit and push data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/netflix_movies.json data/netflix_series.json \
                  data/hbomax_movies.json data/hbomax_series.json \
                  data/primevideo_movies.json data/primevideo_series.json 2>/dev/null || true
          git status
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "chore(data): update streaming catalogs (Netflix, HBO Max, Prime Video)"
            git push
          fi
